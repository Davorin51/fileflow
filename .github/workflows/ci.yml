name: FileFlow verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: fileflow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install optional Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q --cov=fileflow --cov-fail-under=90 --cov-report=term-missing --cov-report=xml --junitxml=build/test-results.xml
      - run: python -m build
      - name: Capture actual desktop demo
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python scripts/capture_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            build/test-results.xml
            coverage.xml
            dist/
            docs/screenshots/
