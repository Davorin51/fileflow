[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fileflow-desktop"
version = "0.1.0"
description = "Preview-first file organization, duplicate review and journaled undo"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Davorin Milicevic"}]
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.8,<7"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
fileflow = "fileflow.cli:main"
fileflow-desktop = "fileflow.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["fileflow"]
omit = ["*/desktop.py", "*/__main__.py"]
[tool.coverage.report]
show_missing = true
